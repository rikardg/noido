[package]
name = "noido-macos"
description = "noido on macOS: what AppKit has and winit does not"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSEvent", "NSMenu", "NSMenuItem", "NSOpenPanel", "NSPanel", "NSResponder", "NSSavePanel", "NSWindow", "NSRunningApplication", "NSWorkspace", "block2", "libc", "objc2-uniform-type-identifiers"] }
objc2-foundation = { workspace = true, features = ["NSAppleEventDescriptor", "NSAppleEventManager", "NSArray", "NSError", "NSNotification", "NSObject", "NSString", "NSURL", "NSThread", "NSUserDefaults", "NSEnumerator", "block2", "objc2-core-services"] }
objc2-uniform-type-identifiers = { workspace = true, features = ["UTType"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
