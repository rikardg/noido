[package]
name = "noido-macos"
description = "noido on macOS: the launcher that opens what Finder sends"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
block2.workspace = true
objc2.workspace = true
objc2-app-kit = { workspace = true, features = ["NSApplication", "NSResponder", "NSRunningApplication", "NSWorkspace", "block2", "libc"] }
objc2-foundation = { workspace = true, features = ["NSArray", "NSError", "NSNotification", "NSObject", "NSString", "NSURL", "NSThread", "NSEnumerator", "block2"] }

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
