name: Snapshot

# One button press: build Linux and macOS, and add a pre-release to the
# release list. Nothing is versioned by hand; the tag carries the time and the
# commit, and each binary stamps the commit it came from into --version.
# Tagged releases and the stable channel stay with the planned dist
# workflow (docs/investigations/2026-10-26-versioning-and-releases.md); the
# macOS app bundle here feeds the snapshot cask in rikardg/homebrew-tap.

on:
    workflow_dispatch:
        inputs:
            note:
                description: Optional first line for the release notes
                required: false
                type: string
            draft:
                description: Leave it as a draft, outside the release list, to check it first
                required: false
                type: boolean
                default: false
    # A branch whose name starts with snapshot-test tries the whole flow:
    # build, pack, upload, draft release.
    push:
        branches: ["snapshot-test*"]

# The builds only read
permissions:
    contents: read

# Two presses at once would race for the tag name; the second waits its turn.
concurrency:
    group: snapshot
    cancel-in-progress: false

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: build (${{ matrix.target }})
        runs-on: ${{ matrix.os }}
        env:
            # Shown by `noido --version`. The workflow is the source of truth.
            NOIDO_GIT_SHA: ${{ github.sha }}
        strategy:
            fail-fast: false
            matrix:
                include:
                    # The images CI checks. 22.04 keeps the binary's glibc floor
                    # at 2.35.
                    - os: ubuntu-22.04
                      target: x86_64-unknown-linux-gnu
                    - os: macos-26
                      target: aarch64-apple-darwin
                    - os: macos-26-intel
                      target: x86_64-apple-darwin
        steps:
            - uses: actions/checkout@v7
            # Caches target/ through Swatinem/rust-cache by default. The version
            # survives the cache: build.rs reruns when NOIDO_GIT_SHA changes.
            - uses: actions-rust-lang/setup-rust-toolchain@v1
            - uses: taiki-e/install-action@v2
              with:
                  tool: just
            - run: just snapshot ${{ matrix.target }}
            # The macOS legs also pack the bundle the cask installs. The
            # Linux leg has no use for one.
            - run: just app-zip ${{ matrix.target }}
              if: contains(matrix.target, 'apple-darwin')
            - uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.target }}
                  path: dist/*
                  if-no-files-found: error

    publish:
        name: publish
        needs: build
        runs-on: ubuntu-22.04
        permissions:
            contents: write
        steps:
            # The notes live in the repo (release/snapshot-notes.md.in), so
            # the job that publishes them needs the tree, `just` to render
            # them, and minijinja-cli to do the rendering.
            - uses: actions/checkout@v7
            - uses: taiki-e/install-action@v2
              with:
                  tool: just
            # The published tarball and its checksum, rather than cargo
            # binstall: binstall's fallback would want a Rust toolchain this
            # job does not have.
            - uses: ./.github/actions/minijinja-cli
            - uses: actions/download-artifact@v8
              with:
                  path: dist
                  merge-multiple: true
            - name: Add the release
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  NOTE: ${{ inputs.note }}
                  SHA: ${{ github.sha }}
                  # A push has no form to tick, and must never publish on its
                  # own: the branch's run leaves a draft.
                  DRAFT: ${{ github.event_name == 'push' || inputs.draft }}
              run: |
                  set -eu
                  short=$(printf '%s' "$SHA" | cut -c1-8)
                  # Seconds, because the tag is the cask's version: two
                  # presses inside one minute would otherwise be ordered by
                  # the hash alone.
                  stamp=$(date -u +%Y%m%d-%H%M%S)
                  tag="snapshot-$stamp-$short"
                  # The notes link to the archives this run uploaded, by the
                  # names in dist/, so a build that lost one fails here rather
                  # than publishing a dead link.
                  linux= mac_arm= mac_intel=
                  for f in dist/*.tar.gz; do
                      case "$f" in
                          *x86_64-unknown-linux-gnu*) linux=${f#dist/} ;;
                          *aarch64-apple-darwin*) mac_arm=${f#dist/} ;;
                          *x86_64-apple-darwin*) mac_intel=${f#dist/} ;;
                      esac
                  done
                  # The cask installs the bundle, so a release without one is
                  # a release the tap cannot use: fail here instead of
                  # publishing a dead source.
                  app_arm= app_intel= app_arm_sha= app_intel_sha=
                  for f in dist/*.app.zip dist/*.app.zip.sha256; do
                      case "$f" in
                          *aarch64-apple-darwin*.sha256) app_arm_sha=${f#dist/} ;;
                          *x86_64-apple-darwin*.sha256) app_intel_sha=${f#dist/} ;;
                          *aarch64-apple-darwin*) app_arm=${f#dist/} ;;
                          *x86_64-apple-darwin*) app_intel=${f#dist/} ;;
                      esac
                  done
                  for asset in "$linux" "$mac_arm" "$mac_intel" "$app_arm" "$app_intel" \
                               "$app_arm_sha" "$app_intel_sha"; do
                      if [ -z "$asset" ]; then
                          echo "dist/ is missing an archive: linux=$linux arm=$mac_arm intel=$mac_intel app_arm=$app_arm app_intel=$app_intel app_arm_sha=$app_arm_sha app_intel_sha=$app_intel_sha" >&2
                          exit 1
                      fi
                  done
                  release="https://github.com/$GH_REPO/releases/download/$tag"
                  # The body is release/snapshot-notes.md.in, rendered by
                  # `just notes`; with nothing set it renders a mock, which
                  # is the local preview. NOTE is the form's first line, and
                  # it sits above the body rather than inside it.
                  SHORT="$short"
                  RELEASE_URL="$release"
                  SOURCE_URL="https://github.com/$GH_REPO/tree/$SHA"
                  LINUX="$linux"
                  MAC_ARM="$mac_arm"
                  MAC_INTEL="$mac_intel"
                  APP_ARM="$app_arm"
                  APP_INTEL="$app_intel"
                  export SHORT RELEASE_URL SOURCE_URL LINUX MAC_ARM MAC_INTEL APP_ARM APP_INTEL
                  {
                      if [ -n "${NOTE:-}" ]; then printf '%s\n\n' "$NOTE"; fi
                      just notes
                  } > notes.md
                  # A variable the recipe does not see falls back to the
                  # mock, and the mock's links do not exist. Every name dist/
                  # was checked for above has to be in the body under this
                  # release's URL.
                  for name in "$linux" "$mac_arm" "$mac_intel" "$app_arm" "$app_intel"; do
                      grep -qF "$release/$name" notes.md || {
                          echo "notes.md does not name $release/$name" >&2
                          exit 1
                      }
                  done
                  draft=""
                  if [ "${DRAFT:-}" = "true" ]; then draft=--draft; fi
                  gh release create "$tag" dist/* \
                      --target "$SHA" \
                      --title "Snapshot $stamp ($short)" \
                      --notes-file notes.md \
                      --prerelease \
                      $draft
