[workspace]
resolver = "3"
members = [
    "crates/noido-engine",
    "crates/engine-hayro",
    "crates/noido-core",
    "crates/noido-macos",
    "crates/noido-render",
    "crates/noido-settings",
    "crates/noido-state",
    "crates/noido-text",
    "crates/frontends/gui-egui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/rikardg/noido"
publish = false

[workspace.dependencies]
noido-engine = { path = "crates/noido-engine" }
engine-hayro = { path = "crates/engine-hayro" }
noido-render = { path = "crates/noido-render" }
noido-core = { path = "crates/noido-core" }
noido-settings = { path = "crates/noido-settings" }
noido-state = { path = "crates/noido-state" }
noido-text = { path = "crates/noido-text" }
noido-macos = { path = "crates/noido-macos" }
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
block2 = "0.6"
hayro = "0.8"
eframe = { version = "0.37", features = ["persistence"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
blake3 = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
notify = "8"
percent-encoding = "2.3"
rfd = "0.17"
url = "2.5"
interprocess = "2"
unicode-normalization = "0.1"
roxmltree = "0.21"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
