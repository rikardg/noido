[workspace]
resolver = "3"
members = [
    "crates/noido-engine",
    "crates/engine-hayro",
    "crates/engine-comic",
    "crates/noido-image",
    "crates/noido-core",
    "crates/noido-macos",
    "crates/noido-render",
    "crates/noido-settings",
    "crates/noido-state",
    "crates/noido-text",
    "crates/noido-blocks",
    "crates/noido-epub",
    "crates/noido-typeset",
    "crates/frontends/gui-egui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/rikardg/noido"
publish = false

[workspace.dependencies]
noido-engine = { path = "crates/noido-engine" }
engine-hayro = { path = "crates/engine-hayro" }
engine-comic = { path = "crates/engine-comic" }
noido-image = { path = "crates/noido-image" }
noido-render = { path = "crates/noido-render" }
noido-core = { path = "crates/noido-core" }
noido-settings = { path = "crates/noido-settings" }
noido-state = { path = "crates/noido-state" }
noido-text = { path = "crates/noido-text" }
noido-blocks = { path = "crates/noido-blocks" }
noido-epub = { path = "crates/noido-epub" }
noido-macos = { path = "crates/noido-macos" }
noido-typeset = { path = "crates/noido-typeset" }
parley = { version = "0.13", default-features = false, features = ["std"] }
hypher = "0.1.8"
# The one parley 0.13 uses.
skrifa = "0.49"
flate2 = "1"
noido-fonts = { git = "https://github.com/rikardg/noido-fonts", tag = "v0.1.0" }
self_cell = "1"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false }
objc2-app-kit = { version = "0.3", default-features = false }
block2 = "0.6"
objc2-uniform-type-identifiers = { version = "0.3", default-features = false }
hayro = "0.9"
zip = { version = "9", default-features = false, features = ["deflate-flate2"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "tiff"] }
fast_image_resize = "6.1"
eframe = { version = "0.37", features = ["persistence"] }
# The one eframe 0.37 uses: on macOS noido builds the event loop itself.
winit = { version = "0.30", default-features = false }
native-theme = { version = "0.7", default-features = false, features = ["native", "watch", "system-fonts"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
blake3 = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "1"
tempfile = "3"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
notify = "8"
percent-encoding = "2.3"
rfd = "0.18"
url = "2.5"
interprocess = "2"
unicode-normalization = "0.1"
roxmltree = "0.21"
pulldown-cmark = { version = "0.13.6", default-features = false }
resvg = { version = "0.50", default-features = false }
# resvg's own, with the PNG encoder the macOS app's icon needs.
tiny-skia = { version = "0.12", default-features = false, features = ["png-format"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# The dev profile keeps line tables for backtraces and drops the rest of the
# debug info: a full debuginfo build is 3.9 G of `target/debug/deps` here and
# 143 s from clean, and a backtrace only ever reads the lines. `line-tables-only`
# is `debug = 1`.
[profile.dev]
debug = "line-tables-only"
