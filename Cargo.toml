[workspace]
resolver = "3"
members = [
    "crates/noido-engine",
    "crates/engine-hayro",
    "crates/noido-core",
    "crates/noido-render",
    "crates/noido-state",
    "crates/noido-text",
    "crates/frontends/gui-egui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"

[workspace.dependencies]
noido-engine = { path = "crates/noido-engine" }
engine-hayro = { path = "crates/engine-hayro" }
noido-render = { path = "crates/noido-render" }
noido-core = { path = "crates/noido-core" }
noido-state = { path = "crates/noido-state" }
noido-text = { path = "crates/noido-text" }
hayro = "0.8"
eframe = { version = "0.37", features = ["persistence"] }
clap = { version = "4", features = ["derive"] }
thiserror = "2"
blake3 = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
ctrlc = { version = "3", features = ["termination"] }
notify = "8"
interprocess = "2"
unicode-normalization = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
